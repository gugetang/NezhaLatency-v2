<!--
  NezhaLatency v2 —— 延迟 / 丢包面板（Komari 参考站风格，适配 Nezha v2）
  ============================================================================
  参考：https://komari.alicloud.ru/（Komari Monitor + Nezha 主题）
    首页卡片底部：当前延迟 + 丢包率 + 两条分段历史条（绿/黄/红，左延迟右丢包）；
    离线显示 --，探针不可达时丢包 100%
  适配目标：nezhahq/nezha v2（dashboard main，官方用户前端 hamster1963/nezha-dash-v2 v2.7.0）
    注意：v2 的仪表盘版本号在构建时注入，源码里默认是 "debug"；
    这里说的 v2.7.0 是前端清单 service/singleton/frontend-templates.yaml 锁定的用户前端版本。
    v1 的接口不要直接套用到 v2 —— 本文件只用下面“已验证接口”列出的 v2 接口。

  已验证接口（nezhahq/nezha main，commit ff43a43，2026-11-20）：
    GET  /api/v1/ws/server               公开（force_auth=false 时游客可用），WebSocket，每 2s 推
                                          {now, online, servers:[{id,name,public_note,display_index,
                                          host,state,country_code,last_active}]}
                                          model/server_api.go:5-21；cmd/dashboard/controller/ws.go
    GET  /api/v1/service                 公开，ServiceResponse{services: map[id]ServiceResponseItem,
                                          cycle_transfer_stats}；每项含 service_name, current_up,
                                          current_down, total_up, total_down, delay[30], up[30], down[30]
                                          model/service_api.go:24-33
    GET  /api/v1/service/:id/history     公开，?period=1d|7d|30d（默认 1d），游客只能查 1d
                                          返回 ServiceHistoryResponse{service_id, service_name,
                                          servers:[{server_id, server_name, stats:{avg_delay,
                                          up_percent, total_up, total_down, data_points:[{ts, delay,
                                          status}]}}]}  model/service_history_api.go:12-37
    GET  /api/v1/profile                 仅登录（JWT，PAT 被禁），200 + success:true = 已登录
                                          用于判断游客/会员；游客调用会 401，这是正常的
    GET  /api/v1/setting                 游客可读（精简版），本文件不依赖它，仅作参考
    GET  /api/v1/server                  仅登录，游客不要用；服务器列表请走上面的 WebSocket
  重要：Nezha v2 里没有任何一个字段叫 loss / 丢包。丢包率一律由 up/down
    计数推导：loss% = 100 - up_percent = down / (up + down) * 100。
  存储：延迟/状态写进 VictoriaMetrics TSDB（nezha_service_delay /
    nezha_service_status，默认保留 30 天），仅当 tsdb.data_path 配置后才
    启用；未启用时走 SQLite ServiceHistory 表。1d 约 30s/点（pkg/tsdb/query.go）。

  安装（Nezha v2 Dashboard）：
    后台 /dashboard/ → 设置 → 自定义代码（custom_code）→ 把本文件全部内容
    粘贴进去保存。用户前端（nezha-dash-v2）加载 /api/v1/setting 后用
    InjectContext(custom_code) 按文档顺序注入：样式与链接进 head，
    脚本按序执行，其它节点进 body。所以本文件必须是“样式 + 节点 +
    脚本”一体的单文件。注入后每张服务器卡片底部会出现延迟条（当前延迟 +
    丢包率 + 两条分段历史柱），条只作展示、不可点（点条会落到卡片本身，进官方服务器详情页）；
    右侧还有一个延迟开关球（与资产统计 $ 球、地球球同组，top:180px），
    默认开启绿点，点一下关闭红点、卡片条全部隐藏，再点恢复。
  配置：只改 script 开头的 CONFIG 对象即可，不用动其它代码；也可以在页面
    里先定义 window.NezhaLatencyConfig 再加载本文件，会与默认配置合并。
  无外部库依赖。
-->
<style>
/* ================= 1. Nezha v2 主题变量适配 =================
   Nezha v2 官方用户前端（nezha-dash-v2 v2.7.0）是 Tailwind v4 + shadcn 风格：
   :root / html.dark 上定义的是 HSL 三元组变量（--background / --foreground /
   --card / --primary / --muted-foreground / --border / --destructive /
   --chart-1..--chart-10），主题由 <html> 的 .dark / .light class +
   localStorage "vite-ui-theme" 控制。这里把它们映射成 --nl-* 变量，并给出去掉
   Nezha 环境也能用的回退值。 */
:root {
  --nl-bg: hsl(var(--background, 0 0% 98%));
  --nl-card: hsl(var(--card, 0 0% 100%));
  --nl-fg: hsl(var(--foreground, 20 14.3% 4.1%));
  --nl-muted: hsl(var(--muted-foreground, 25 5.3% 44.7%));
  --nl-border: hsl(var(--border, 20 5.9% 90%));
  --nl-accent: hsl(var(--primary, 24 9.8% 10%));
  --nl-accent-fg: hsl(var(--primary-foreground, 60 9.1% 97.8%));
  --nl-danger: hsl(var(--destructive, 0 84.2% 60.2%));
  --nl-shadow: rgba(0, 0, 0, 0.12);
  --nl-green: #22c55e;
  --nl-amber: #f59e0b;
  --nl-red: #ef4444;
  --nl-grey: #9ca3af;
  --nl-accent-solid: #3b82f6;
}
html.dark {
  --nl-bg: hsl(var(--background, 30 15% 8%));
  --nl-card: hsl(var(--card, 20 14.3% 4.1%));
  --nl-fg: hsl(var(--foreground, 60 9.1% 97.8%));
  --nl-shadow: rgba(0, 0, 0, 0.45);
}
/* 延迟显示开关（#nl-fab，2026-11-21）：右侧悬浮按钮，与资产统计（$ 球）/
   地球球同一列：45px 圆形，位置 $ 球 top:70px、地球球 top:125px，
   本球 top:180px（55px 间距），right:20px，不挡卡片内容。
   样式按 Komari 站截图：不要边框、透底（背景透明、无阴影、无毛玻璃），
   里面是 24px 描边图标。行为是开关卡片条的显隐。按钮本身不带圆点：图标颜色表示状态，
   开启绿 #22c55e、关闭红 #ef4444（点击切换）。 */
/* 卡片条关闭时：body 加 .nl-strips-off，新注入的条也会自动隐藏 */
body.nl-strips-off .nl-home-strip { display: none !important; }
#nl-fab {
  position: fixed; right: 20px; top: 180px;
  width: 45px; height: 45px; border-radius: 50%;
  background: transparent;
  border: none;
  box-shadow: none;
  z-index: 1041;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0;
  color: #22c55e;
  transition: all 0.3s ease;
}
#nl-fab:hover { transform: scale(1.1); }
#nl-fab.off { color: #ef4444; }
#nl-fab svg { display: block; }

/* 分段历史条（Komari 风格：30 段，绿/黄/红） */
.nl-bars { display: flex; gap: 3px; height: 6px; margin: 4px 0 2px; }
.nl-bars i { flex: 1; border-radius: 999px; background: var(--nl-grey); min-width: 2px; }
.nl-bars i.g { background: var(--nl-green); }
.nl-bars i.a { background: var(--nl-amber); }
.nl-bars i.r { background: var(--nl-red); }
/* Komari 卡片式延迟/丢包条（截图样式）：一行“延迟 xxx ms 丢包率 x.x%”，下面左右两条分段条并排
   尺寸对标卡片原生统计行（nezha-dash bundle 实测：标签/数值均为 text-xs=12px，
   下方细进度条 h-1=4px；截图实测条文字比原生大 ~26%、柱体约 2 倍，故改小） */
.nl-card-strip { margin-top: 6px; }
.nl-card-strip-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.75rem; color: var(--nl-muted); }
.nl-card-strip-head b { color: var(--nl-fg); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
/* 首页条字号对标卡片“价格/剩余天数”行（nezha-dash bundle 实测 text-[10px]=10px，
   截图实测该行字高 22px、条行字高 25px；只改首页条） */
.nl-home-strip .nl-card-strip-head, .nl-home-strip .nl-card-strip-head b { font-size: 0.625rem; }
.nl-card-strip-bars { display: flex; gap: 8px; margin-top: 4px; }
.nl-card-strip-bars .nl-bars { flex: 1; margin: 0; height: 4px; gap: 2px; }
/* 横向列表模式：卡片是横向 flex 行（名称/分隔线/统计三项，合计约 870px，小于卡片
   最小宽 900px）；条挂在卡片内时需要允许换行，宽 100% 的条才能独占一行落到
   卡片底部，而不是被挤进横向一排。只改横向列表里的卡片，网格卡片（纵向 flex）不受影响 */
.server-inline-list .cursor-pointer { flex-wrap: wrap; }
/* 流量进度条（合并进来的第 4 个脚本块）：整行显示——作为卡片的直接子元素、
   宽 100%，在横向卡片里换行独占一行，在纵向卡片里自然占满整行；位置在
   延迟条之前（卡片倒数第二行），与上方内容隔开 */
.nl-traffic-row { margin-top: 8px; }

/* 首页卡片延迟条：地区实时值（按后端服务前缀动态分组，各一行），只作展示，不可点 */
.nl-home-strip { border-top: 1px solid var(--nl-border); padding-top: 8px; width: 100%; box-sizing: border-box; }
/* 首页卡片条：每地区一行，第一行分左右两半，与下方分段柱左右对齐：左半为地区名 +
   延迟值（延迟值右对齐到延迟柱右端），右半为丢包率（右对齐到丢包柱右端）；
   下面左右两条分段柱并排（左延迟、右丢包；柱体手机 12 段、电脑 24 段）。条本身是卡片内最底部元素，只作展示，不可点。 */
/* 第一行两半与下方两条柱等宽（flex:1，间距同为 8px），使延迟值、丢包率各自对齐到对应柱体的右端 */
.nl-region-head { gap: 8px; }
.nl-region-head-half { flex: 1; display: flex; align-items: baseline; }
.nl-region-head-half:first-child { justify-content: space-between; }
.nl-region-head-half.nl-region-head-right { justify-content: flex-end; }
.nl-region-row { padding: 4px 0 1px; }
.nl-region-row + .nl-region-row { border-top: 1px dashed var(--nl-border); margin-top: 3px; }
.nl-region-row .nl-region-tag { font-weight: 600; color: var(--nl-fg); }
</style>

<!-- 延迟开关球见文件末尾 #nl-fab（与 $ 球、地球球同组右侧悬浮按钮） -->
<!--延迟显示开关（#nl-fab）：与资产统计 $ 球、地球球同组右侧悬浮按钮，点一下开关卡片条显隐；图标绿=开、红=关-->
<button id="nl-fab" type="button" title="延迟显示：开，点击关闭" aria-label="延迟显示开关" aria-pressed="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg></button>


<script>
// ================= 2. 配置（只改这里） =================
var NezhaLatencyConfig = Object.assign({
  apiBase: '',                 // '' = 与当前页面同源（custom_code 注入时请保持 ''）；独立测试时可填 https://nezha.example.com（需服务端允许 CORS）
  wsServerUrl: '/api/v1/ws/server',
  serviceApi: '/api/v1/service',
  profileApi: '/api/v1/profile',
  refreshSec: 30,              // 自动刷新间隔（秒），0 = 不自动刷新
  thresholds: {
    latencyGreen: 200,         // 延迟 <200ms 绿色（Komari 截图：RakSmart 183ms 为绿色，所以绿线必须 >183，取 200；不是官方前端的 100）
    latencyAmber: 300,         // 延迟 <300ms 黄色，否则红色
    lossGreen: 1,              // 丢包 <1% 绿色；正常率 >=99% 绿色，>=95% 黄色，否则红色
    lossAmber: 5
  },
  // 延迟显示开关（#nl-fab，2026-11-21）：与 $ 球、地球球同组右侧悬浮按钮，
  // 默认开启（绿点），点一下关闭（红点，卡片条全部隐藏），再点恢复；状态存
  // localStorage 'nl-strips-enabled'，刷新后保持。按钮只开关卡片条显隐。
  attachCards: true,           // 尽力而为：给官方前端的服务器卡片内最底部加地区实时延迟条（按后端服务前缀动态分组，每行一组：组内最新有效点延迟 + 最近 1 小时丢包 + 最近 24 小时分段柱（手机 12 段、电脑 24 段），截图样式，条只作展示不可点；失败不影响页面）
  wsStaleSec: 90               // WS 的 last_active 超过这么多秒未更新，视为离线
}, (window.NezhaLatencyConfig || {}));
</script>
<script>
(function () {
  'use strict';
  // 注意：不要用 window.NezhaLatencyConfig！外层已把默认值和用户配置合并
  // 进局部变量 NezhaLatencyConfig（见上一 <script> 块），站上通常不定义
  // window.NezhaLatencyConfig；若这里取 window 上的值会得到 undefined，
  // 随后 state 初始化读 CFG.defaultRange 立即抛 TypeError，导致 boot()、
  // init() 和所有点击监听都没跑到，按钮看得见却点不动（2026-11-20 实测）。
  var CFG = NezhaLatencyConfig;
  var $ = function (id) { return document.getElementById(id); };
  function apiUrl(path) {
    if (!CFG.apiBase) return path;
    return String(CFG.apiBase).replace(/\/$/, '') + path;
  }
  function wsUrl(path) {
    if (CFG.apiBase) {
      var u = new URL(path, CFG.apiBase);
      u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:';
      return u.toString();
    }
    return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + path;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtMs(v) { return v == null || isNaN(v) ? '--' : Math.round(v) + 'ms'; }
  function fmtPct(v) { return v == null || isNaN(v) ? '--' : v.toFixed(1) + '%'; }
  function latencyClass(v) {
    if (v == null || isNaN(v)) return 'grey';
    if (v < CFG.thresholds.latencyGreen) return 'g';
    if (v < CFG.thresholds.latencyAmber) return 'a';
    return 'r';
  }
  function lossClass(v) { // v = loss %
    if (v == null || isNaN(v)) return 'grey';
    if (v < CFG.thresholds.lossGreen) return 'g';
    if (v < CFG.thresholds.lossAmber) return 'a';
    return 'r';
  }
  // ---- API：统一处理 {success, data, error} 信封；HTTP 200 也可能 success:false ----
  function apiGet(path) {
    return fetch(apiUrl(path), { credentials: 'same-origin' }).then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.success === false) throw new Error(j.error || ('请求失败：' + path));
        return j && ('data' in j) ? j.data : j;
      });
  }
  // ---- 延迟显示开关（#nl-fab，2026-11-21）：开关卡片条显隐 ----
  // 状态存 localStorage 'nl-strips-enabled'，'1' = 开（默认），'0' = 关；
  // 读不到或异常时默认开启。显隐用 body 上的 .nl-strips-off class + CSS 控制，
  // 开关关闭期间新注入的条也会自动隐藏。
  var STRIPS_KEY = 'nl-strips-enabled';
  function readStripsEnabled() {
    try { return localStorage.getItem(STRIPS_KEY) !== '0'; } catch (e) { return true; }
  }
  var state = {
    member: null,              // null=未知，true=已登录，false=游客
    stripsEnabled: readStripsEnabled(), // 延迟卡片条开关：true=显示（绿点），false=隐藏（红点）
    servers: [],               // WS 来的服务器
    services: [],              // [{id, name, type, ...}]，来自 /api/v1/service
    regionGroups: [],          // 地区列表：按 service_name 前缀动态分组（见 loadServices），后台增删服务时跟着变
    regionLabel: {},           // 地区行名：前缀 -> 后端服务实际名称（见 loadServices），如 SCCM -> SCCM-v4
    histByServer: {},          // serverId -> {groups: {prefix: {delay, loss, ts, n1h, buckets}}}
    ws: null, wsTimer: null, refreshTimer: null
  };
  function checkLogin() {
    return fetch(apiUrl(CFG.profileApi), { credentials: 'same-origin' })
      .then(function (r) { return r.json().then(function (j) { return r.ok && j && j.success === true; }); })
      .then(function (ok) { state.member = !!ok; return state.member; })
      .catch(function () { state.member = false; return false; });
  }
  function isOnline(srv, nowMs) {
    if (!srv) return false;
    if (srv.last_active) {
      var t = new Date(srv.last_active).getTime();
      if (!isNaN(t)) return (nowMs - t) <= CFG.wsStaleSec * 1000;
    }
    return !!srv.state; // 无 last_active 时，有 state 即视为在线（兜底，见 README）
  }

  // ---- 首页卡片条：地区动态分组取数口径 ----
  // 地区不写死：从后端 /api/v1/service 拿到的服务列表按 service_name 前缀动态
  // 分组（同一前缀归为一个地区，如 SCCM-v4 与 SCCM-v6 同属 SCCM 组；行名取该组
  // 后端服务的实际 service_name，见 regionLabel）。后台增删服务时分组跟着变：新增一组服务卡片多一行，删掉
  // 就少一行，不留死数据（分组存在 state.regionGroups，见 loadServices）。
  // 每组数据来自该组各服务的 history：实时延迟取组内最近一个有效数据点
  // （status=1 且 delay>0；超过 10 分钟视为过期显示 --），丢包 = 最近 1 小时内
  // 该组点的 down/(up+down)。只有“近期有效”的服务才计入组内统计——有效 =
  // 最近 1 小时内至少有一个 status=1 且 delay>0 的点；失联的 v6（最近 1 小时
  // 全是失败点）会被整段排除，不会把 0ms / 100% 丢包混进组里；某组全部服务都
  // 无效时该行显示 --。
  var REGION_STALE_MS = 10 * 60 * 1000; // 最新数据点超过 10 分钟视为过期，延迟显示 --
  var REGION_LOSS_WINDOW_MS = 60 * 60 * 1000; // 丢包取最近 1 小时内该组数据点
  function serviceRegion(s) {
    var name = (s && s.service_name) || '';
    var head = name.split(/[-_\s]/)[0] || '';
    return head.replace(/v\d+$/i, '') || name;
  }

  // ---- 数据加载 ----
  function loadServices() {
    return apiGet(CFG.serviceApi).then(function (data) {
      var map = (data && data.services) || {};
      state.services = Object.keys(map).map(function (k) {
        var it = map[k] || {};
        it._id = Number(k);
        return it;
      }).sort(function (a, b) { return (a.service_name || '').localeCompare(b.service_name || ''); });
      // 地区动态分组：按 service_name 前缀，首次出现顺序（services 已按名字排过序，
      // 所以前缀也是字母序）；后台增删服务时下次刷新会重新算，卡片行数跟着变
      state.regionGroups = [];
      state.services.forEach(function (s) {
        var p = serviceRegion(s);
        if (p && state.regionGroups.indexOf(p) === -1) state.regionGroups.push(p);
      });
      // 地区行名 = 后端服务实际名称，不写死、不编中文名：组里有 -v4 服务就用它的
      // service_name（如 SCCM 组显示 SCCM-v4），没有 -v4 就用组里第一个服务
      // （services 已按名字排过序）的 service_name；行名进 stripKey，服务增减
      // 改名时条会重绘
      state.regionLabel = {};
      state.services.forEach(function (s) {
        var p = serviceRegion(s), nm = (s && s.service_name) || '';
        if (!p || !nm) return;
        if (!state.regionLabel[p]) state.regionLabel[p] = nm;
        if (nm === p + '-v4') state.regionLabel[p] = nm;
      });
      return state.services;
    });
  }
  // 用各服务的 1d 历史汇总出每台服务器各地区的延迟/丢包（只发 S 次请求，S=服务数）
  function loadServerLatency() {
    var nowMs = Date.now();
    var dayStart = nowMs - 86400000; // 地区分段柱的起点：最近 24 小时
    var groupBucketMs = 3600000, GROUP_BUCKETS = 24; // 卡片条地区分段柱：最近 24 小时分 24 桶（每桶 1 小时）；手机端渲染时相邻两桶合并成 12 段
    var gAgg = {}; // serverId -> prefix -> {lastDelay, lastTs, up1h, down1h}
    var jobs = state.services.map(function (s) {
      return apiGet('/api/v1/service/' + s._id + '/history?period=1d').then(function (data) {
        (data.servers || []).forEach(function (sv) {
          var st = sv.stats || {};
          // 地区实时值：该组内所有服务（v4/v6）的数据点都参与，但只有“近期有效”
          // 的服务才计入——有效 = 最近 1 小时内至少有一个 status=1 且 delay>0
          // 的点；失联的 v6 会被整段排除，不会把 0ms / 100% 丢包混进组里
          var gPrefix = serviceRegion(s);
          if (gPrefix) {
            var gPts = st.data_points || [];
            var gValid = false;
            for (var gi = 0; gi < gPts.length; gi++) {
              var gp = gPts[gi];
              if (!gp) continue;
              var gm = tsToMs(gp.ts);
              if (gp.status === 1 && typeof gp.delay === 'number' && gp.delay > 0 && gm != null && gm >= nowMs - REGION_LOSS_WINDOW_MS) { gValid = true; break; }
            }
            if (gValid) {
              var gBySid = gAgg[sv.server_id] || (gAgg[sv.server_id] = {});
              var gr = gBySid[gPrefix] || (gBySid[gPrefix] = { lastDelay: null, lastTs: 0, up1h: 0, down1h: 0, buckets: null });
              if (!gr.buckets) {
                gr.buckets = [];
                for (var gbi = 0; gbi < GROUP_BUCKETS; gbi++) gr.buckets.push({ dSum: 0, dN: 0, up: 0, down: 0 });
              }
              gPts.forEach(function (p) {
                if (!p) return;
                var m = tsToMs(p.ts);
                if (m != null && m >= nowMs - REGION_LOSS_WINDOW_MS) {
                  if (p.status === 1) gr.up1h++; else if (p.status === 0) gr.down1h++;
                }
                if (p.status === 1 && typeof p.delay === 'number' && p.delay > 0 && m != null && m > gr.lastTs) { gr.lastTs = m; gr.lastDelay = p.delay; }
                // 该地区分段柱：最近 24 小时分 24 桶（每桶 1 小时），只计有效点
                // （status=1 且 delay>0）；桶内无有效点时延迟/丢包均为 null，渲染成灰段
                if (m != null) {
                  var gidx = Math.floor((m - dayStart) / groupBucketMs);
                  if (gidx >= 0 && gidx < GROUP_BUCKETS) {
                    var gbk = gr.buckets[gidx];
                    if (p.status === 1 && typeof p.delay === 'number' && p.delay > 0) { gbk.dSum += p.delay; gbk.dN++; }
                    if (p.status === 1) gbk.up++; else if (p.status === 0) gbk.down++;
                  }
                }
              });
            }
          }
        });
      }).catch(function () { /* 单个服务历史失败不阻塞整体，见 README */ });
    });
    return Promise.all(jobs).then(function () {
      var out = {};
      // 按当前 state.regionGroups 建组：后台删掉的组不再出现（不留死数据），
      // 没数据的组保留空值，卡片行显示 --；没有任何历史的服务器（如离线机）
      // 也给一个空 groups 占位，卡片条才能挂上 -- 行，而不是被静默跳过。
      // 注意：按 history 里出现的服务器建 out（不只按 state.servers），因为
      // 首屏时 WS 可能还没推来服务器列表；WS 到达后 attachCardStrips 会用
      // 已算好的 groups 渲染，30 秒刷新时再补齐
      var sids = {};
      Object.keys(gAgg).forEach(function (k) { sids[k] = true; });
      state.servers.forEach(function (srv) { sids[srv.id] = true; });
      Object.keys(sids).forEach(function (sid) {
        var groups = {};
        (state.regionGroups || []).forEach(function (prefix) {
          var gr = (gAgg[sid] || {})[prefix];
          var tot = gr ? gr.up1h + gr.down1h : 0;
          groups[prefix] = {
            delay: (gr && gr.lastTs && (nowMs - gr.lastTs) <= REGION_STALE_MS) ? gr.lastDelay : null,
            loss: (gr && tot) ? (gr.down1h / tot) * 100 : null,
            ts: (gr && gr.lastTs) || null, n1h: tot,
            // 分段柱：该地区最近 24 小时 24 桶（每桶 1 小时），每桶延迟 = 桶内有效点
            // 平均延迟，丢包 = 桶内 down/(up+down)；桶内无有效点时该段为 null（灰段）
            buckets: (gr && gr.buckets) ? gr.buckets.map(function (bk) {
              var btot = bk.up + bk.down;
              return { delay: bk.dN ? bk.dSum / bk.dN : null, loss: btot ? (bk.down / btot) * 100 : null };
            }) : []
          };
        });
        out[sid] = { groups: groups };
      });
      state.histByServer = out;
      attachCardStrips();
      return out;
    });
  }
  function connectWS() {
    try { if (state.ws) state.ws.close(); } catch (e) {}
    var ws;
    try { ws = new WebSocket(wsUrl(CFG.wsServerUrl)); } catch (e) { onWsFail(); return; }
    state.ws = ws;
    ws.onmessage = function (ev) {
      try {
        var d = JSON.parse(ev.data);
        if (d && d.servers) { state.servers = d.servers; attachCardStrips(); }
      } catch (e) {}
    };
    ws.onclose = function () { state.wsTimer = setTimeout(connectWS, 5000); };
    ws.onerror = function () { /* onclose 会重连 */ };
    setTimeout(function () {
      if (!state.servers.length) onWsFail();
    }, 8000);
  }
  function onWsFail() {
    if (!state.servers.length && state.member === true) {
      // 已登录兜底：GET /api/v1/server（游客不可用）
      apiGet('/api/v1/server').then(function (list) {
        state.servers = (list || []).map(function (s) {
          return { id: s.id, name: s.name, country_code: s.country_code, display_index: s.display_index, last_active: s.last_active, state: s.state || null };
        });
        attachCardStrips();
      }).catch(function () {
        try { console.warn('[NezhaLatency] 服务器列表加载失败：WebSocket 未连通，且登录接口也不可用。请检查面板地址 / 反代配置。'); } catch (e) {}
      });
    } else if (!state.servers.length) {
      try { console.warn('[NezhaLatency] 服务器列表加载失败：WebSocket 未连通。请检查面板地址 / 反代是否放行 WebSocket。'); } catch (e) {}
    }
  }
  // ---- 数据加载（卡片条） ----
  // 首屏与每 30 秒刷新：先判断登录（供 WS 失败兜底用），再拉服务列表与各服务
  // 1d 历史汇总出地区延迟/丢包，最后连 WebSocket 拿服务器列表；三步都只为
  // 首页卡片条服务
  function loadStripData() {
    return checkLogin().then(function () {
      return loadServices();
    }).then(function () {
      connectWS();
      return loadServerLatency();
    }).catch(function (err) {
      try { console.warn('[NezhaLatency] 卡片条数据加载失败：' + (err && err.message ? err.message : err)); } catch (e) {}
    });
  }
  function tsToMs(ts) { var n = Number(ts); if (!isFinite(n)) return null; return n < 1e12 ? n * 1000 : n; }

  // ---- 首页服务器卡片延迟条：地区实时值（尽力而为） ----
  // 每张卡内最底部按地区各一行（行数 = 后端服务分组数，动态变），每行都是截图
  // 样式：第一行分左右两半（左半：地区名 + 延迟值，右半：丢包率），下面左右两条 12 段分段柱
  // 并排（左延迟、右丢包）。取数口径（见 loadServerLatency）：每组取组内各服务
  // history 里最近一个有效数据点做当前延迟（status=1 且 delay>0，超过 10 分钟
  // 视为过期显示 --），丢包 = 最近 1 小时内该组点的 down/(up+down)；分段柱 =
  // 该地区最近 24 小时 12 桶（每桶 2 小时），每桶延迟 = 桶内有效点平均延迟，
  // 丢包 = 桶内 down/(up+down)，桶内无有效点时该段为灰色。只计近期有效的服务，
  // 失联的 v6 不混进组里；某组全部服务无效该行显示 --。条挂在挂载元素的最末尾（见
  // attachCardStrips），React 重建后补挂也会把它挪回最底部。
  // 条只作展示、不可点：不绑点击，点条会冒泡到卡片本身（官方服务器详情页）。
  // 根因（2026-11-21 实测前端 bundle /assets/index.CxhV59WK.js）：nezha-dash
  // 1dd038b 首页卡片根本不是 <a href="/server/N">，而是 Card <div>（class 含
  // cursor-pointer），点击靠 React Router navigate(`/server/${id}`)；旧代码的
  // a[href^="/server/"] 选择器命中 0 张卡。数据链路本身是通的（/api/v1/service
  // 与 history 公开可用）。新挂载按列表容器 + 卡片名定位（见 findHomeCards），
  // React 每 2 秒 WS 推送都会重建卡片 DOM，所以除 5 秒轮询外再加
  // MutationObserver 监听 #root（见 init 的 watchHomeCards）；数据未到先挂
  // -- 占位条，数据到了按 key 更新内容，不重复创建。
  // 行名取后端服务的实际名称：组里有 -v4 服务就用它的 service_name
  // （如 SCCM 组显示 SCCM-v4），没有 -v4 就用组里第一个服务的 service_name；
  // 不写死名字、不编中文名；服务列表未到或组里无服务时退回前缀本身
  function regionLabel(prefix) {
    return (state.regionLabel && state.regionLabel[prefix]) || prefix;
  }
  // 柱体段数：手机（宽 <=768）12 段、电脑 24 段；地区桶按 24 桶（每桶 1 小时）聚合，
  // 手机端把相邻两桶合并成一段（2 小时）
  function stripSegmentCount() { return (window.innerWidth || 1024) <= 768 ? 12 : 24; }
  function mergeBucketPair(b1, b2) {
    function avg(a, b) { if (a == null) return b; if (b == null) return a; return (a + b) / 2; }
    return { delay: avg(b1.delay, b2.delay), loss: avg(b1.loss, b2.loss) };
  }
  // 截图样式：每地区一行，第一行分左右两半（左半地区名 + 延迟值、右半丢包率，各自对齐到下方对应柱体的右端），下面左右
  // 两条分段柱并排（左延迟、右丢包）；桶内无数据时该段为灰色，不编数值
  function stripRegionRowHTML(prefix, g, online) {
    var d = online ? (g && g.delay) : null;
    var l = online ? (g && g.loss) : null;
    var bk = (g && g.buckets) || [];
    var n = stripSegmentCount();
    var barsLat = '', barsLoss = '';
    for (var i = 0; i < n; i++) {
      var b = n === 24 ? (bk[i] || {}) : mergeBucketPair(bk[2 * i] || {}, bk[2 * i + 1] || {});
      barsLat += '<i class="' + latencyClass(b.delay) + '"></i>';
      barsLoss += '<i class="' + lossClass(b.loss) + '"></i>';
    }
    var dTxt = (d == null || isNaN(d)) ? '--' : Math.round(d) + ' ms';
    return '<div class="nl-region-row">' +
      '<div class="nl-card-strip-head nl-region-head"><span class="nl-region-head-half"><span class="nl-region-tag">' + esc(regionLabel(prefix)) + '</span><span>延迟 <b>' + dTxt + '</b></span></span><span class="nl-region-head-half nl-region-head-right"><span>丢包率 <b>' + fmtPct(l) + '</b></span></span></div>' +
      '<div class="nl-card-strip-bars"><div class="nl-bars">' + barsLat + '</div><div class="nl-bars">' + barsLoss + '</div></div>' +
      '</div>';
  }
  function stripInnerHTML(h, online) {
    h = h || {};
    var groups = h.groups || {};
    return (state.regionGroups || []).map(function (prefix) { return stripRegionRowHTML(prefix, groups[prefix], online); }).join('');
  }
  // 首页卡片定位：见本节文件头注释。返回 [{wrap, cardEl, mount, sid}]。
  // wrap = 列表容器的直接子元素；cardEl = 真正的卡片（class 含 cursor-pointer）；
  // mount = 条要挂的父元素：两种模式都直接挂在卡片（cardEl）内、作为卡片最后
  // 一个子元素。横向模式的卡片是横向 flex 行，靠样式 .server-inline-list
  // .cursor-pointer { flex-wrap: wrap } 让宽 100% 的条换行独占一行落到底部，
  // 不挤坏横向布局；条绝不挂在卡片外的包裹层上（否则电脑端看起来像单独一张卡）。
  function findHomeCards() {
    var cards = [], seen = [];
    var byName = {};
    state.servers.forEach(function (srv) {
      (byName[srv.name] || (byName[srv.name] = [])).push(srv);
    });
    var nameSeen = {}; // 同名卡按 DOM 出现顺序对第 N 台同名服务器（默认排序下组内保持 WS 顺序）
    function resolveName(name) {
      var list = byName[name];
      if (!list || !list.length) return null;
      var idx = nameSeen[name] || 0;
      nameSeen[name] = idx + 1;
      return list[Math.min(idx, list.length - 1)].id;
    }
    function cardName(cardEl) {
      var ps = cardEl.querySelectorAll('p');
      for (var i = 0; i < ps.length; i++) {
        var cls = ps[i].className || '';
        if ((' ' + cls + ' ').indexOf(' font-bold ') < 0) continue;
        var t = (ps[i].textContent || '').trim();
        if (t && byName[t]) return t;
      }
      return null;
    }
    function addCard(wrap, cardEl, sid) {
      if (!cardEl || seen.indexOf(cardEl) >= 0) return;
      seen.push(cardEl);
      cards.push({ wrap: wrap, cardEl: cardEl, mount: cardEl, sid: sid });
    }
    document.querySelectorAll('.server-card-list, .server-inline-list').forEach(function (list) {
      Array.prototype.forEach.call(list.children, function (wrap) {
        var cardEl = wrap.classList.contains('cursor-pointer') ? wrap : wrap.querySelector('.cursor-pointer');
        if (!cardEl) cardEl = wrap;
        var name = cardName(cardEl);
        addCard(wrap, cardEl, name != null ? resolveName(name) : null);
      });
    });
    // 兜底：渲染成 <a href="/server/N"> 的卡片（其他主题/版本）
    document.querySelectorAll('a[href*="/server/"]').forEach(function (a) {
      var m = (a.getAttribute('href') || '').match(/\/server\/(\d+)/);
      if (!m) return;
      addCard(a, a, Number(m[1]));
    });
    return cards;
  }
  function stripKey(sid, h, online) {
    var parts = [sid, online ? '1' : '0', 'seg' + stripSegmentCount()]; // 段数变了也要重绘（窗口缩放过手机/电脑分界）
    (state.regionGroups || []).forEach(function (prefix) {
      var g = (h.groups || {})[prefix] || {};
      parts.push(regionLabel(prefix)); // 行名（后端服务名）变了也要重绘
      parts.push(g.delay == null ? '' : Math.round(g.delay), g.loss == null ? '' : g.loss.toFixed(1));
      // 分段柱变化也要触发重绘：每桶延迟四舍五入拼进 key
      parts.push(((g.buckets || []).map(function (bk) { return bk.delay == null ? '' : Math.round(bk.delay); }).join(',')));
    });
    return parts.join('|');
  }
  function attachCardStrips() {
    if (!CFG.attachCards || !state.servers.length || !state.regionGroups.length) return;
    try {
      var nowMs = Date.now();
      findHomeCards().forEach(function (c) {
        if (c.sid == null) return; // 名字对不上任何服务器：不挂，避免挂错服务器
        var srv = state.servers.filter(function (x) { return x.id === c.sid; })[0];
        if (!srv) return;
        var h = state.histByServer[c.sid] || { groups: {} }; // 数据未到先挂 -- 占位条
        var online = isOnline(srv, nowMs);
        var key = stripKey(c.sid, h, online);
        var strip = null;
        var hosts = [c.mount, c.cardEl, c.wrap]; // 条可能残留在另一处（旧版横向模式挂在外层 section 上、布局模式切换后），三处都找，找到就挪进卡片
        for (var hi = 0; hi < hosts.length && !strip; hi++) {
          var host = hosts[hi];
          if (!host) continue;
          for (var i = 0; i < host.children.length; i++) {
            if (host.children[i].classList && host.children[i].classList.contains('nl-home-strip')) { strip = host.children[i]; break; }
          }
        }
        if (strip) {
          if (strip._nlKey !== key) { strip.innerHTML = stripInnerHTML(h, online); strip._nlKey = key; }
          // 条必须是挂载元素的最底部：位置不对（模式切换、React 重建后又插了新
          // 节点）就挪到末尾；appendChild 已存在的节点会先把它移走再追加
          if (strip.parentNode !== c.mount || c.mount.lastChild !== strip) c.mount.appendChild(strip);
          return;
        }
        strip = document.createElement('div');
        strip.className = 'nl-card-strip nl-home-strip';
        strip.innerHTML = stripInnerHTML(h, online);
        strip._nlKey = key;
        c.mount.appendChild(strip);
      });
    } catch (e) {}
  }
  // React 重建卡片 DOM 时补挂：监听 #root 的子节点变化，防抖 300ms 调 attach。
  var cardObsTimer = null, cardObserver = null;
  function scheduleAttach() {
    if (cardObsTimer) return;
    cardObsTimer = setTimeout(function () { cardObsTimer = null; attachCardStrips(); }, 300);
  }
  function watchHomeCards() {
    if (cardObserver || typeof MutationObserver === 'undefined') return;
    var root = document.getElementById('root') || document.body;
    cardObserver = new MutationObserver(function (muts) {
      for (var i = 0; i < muts.length; i++) {
        if (muts[i].addedNodes && muts[i].addedNodes.length) { scheduleAttach(); return; }
      }
    });
    cardObserver.observe(root, { childList: true, subtree: true });
  }
  // 把开关状态同时写到三处：body class（控制条显隐）、按钮颜色/title、localStorage
  function applyStripsEnabled() {
    var on = !!state.stripsEnabled;
    document.body.classList.toggle('nl-strips-off', !on);
    var fab = $('nl-fab');
    if (fab) {
      fab.classList.toggle('off', !on);
      fab.title = on ? '延迟显示：开，点击关闭' : '延迟显示：关，点击开启';
      fab.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    try { localStorage.setItem(STRIPS_KEY, on ? '1' : '0'); } catch (e) {}
  }
  function toggleStrips() { state.stripsEnabled = !state.stripsEnabled; applyStripsEnabled(); }
  // ---- 初始化 ----
  function init() {
    var fab = $('nl-fab');
    if (fab) fab.addEventListener('click', function () { toggleStrips(); });
    applyStripsEnabled();
    window.addEventListener('resize', function () { scheduleAttach(); }); // 窗口缩放过手机/电脑分界时重算柱体段数
    if (CFG.refreshSec > 0) {
      state.refreshTimer = setInterval(function () {
        if (document.hidden) return;
        loadStripData(); // 首页卡片条定时刷新
      }, CFG.refreshSec * 1000);
    }
    // 首页卡片条：页面渲染后尽力挂上（React 会重建卡片 DOM，MutationObserver +
    // 5 秒轮询补挂）
    watchHomeCards();
    setInterval(attachCardStrips, 5000);
    // 首屏就加载数据
    loadStripData();
    window.NezhaLatency = { refresh: loadStripData, toggleStrips: toggleStrips, config: CFG, state: state };
  }
  function boot() {
    if (document.getElementById('root')) { init(); return; }
    var ob = new MutationObserver(function () {
      if (document.getElementById('root')) { ob.disconnect(); init(); }
    });
    ob.observe(document.documentElement, { childList: true, subtree: true });
    setTimeout(function () { if (!window.NezhaLatency) { ob.disconnect(); init(); } }, 8000);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>

<script>
// ================= 3. 流量进度条（合并自流量项目） =================
// 来源：gugetang/NeZha-UI-ShowTraffic traffic-progress.js v20260803，
// 合并时与上游 ziwiwiz/nezha-ui@main 同一文件一字不差；只改了两处：
// (1) 挂载位置：不再插到统计区后面（会挤进统计列），而是作为卡片的直接子
//     元素、宽 100%、插在延迟条之前，整行显示；
// (2) 元素多一个 nl-traffic-row class（样式见本文件 <style>，与上方内容隔开）。
// 配置沿用站上已有的 window.TrafficScriptConfig（showTrafficStats /
// interval / toggleInterval / duration / apiUrl / enableLog），删掉单独的
// traffic-progress.js 引用行即可，配置块本身不用动。
(() => {
  'use strict';

  const VERSION = 'v20260803';
  const INSTANCE_KEY = '__nezhaTrafficProgress';

  // Avoid duplicate timers/observers when the script is injected more than once.
  const previous = window[INSTANCE_KEY];
  if (previous?.version === VERSION) return;
  if (typeof previous?.destroy === 'function') previous.destroy();

  const DEFAULT_CONFIG = {
    showTrafficStats: true,
    insertAfter: true, // 合并版不再使用：流量行一律整行挂在卡片内（见 renderTrafficStats），保留该键只为兼容旧配置
    interval: 60000,
    toggleInterval: 5000,
    duration: 500,
    apiUrl: '/api/v1/service',
    enableLog: false
  };

  const TARGET_SELECTOR = 'section.server-card-list, section.server-inline-list';
  const CARD_TITLE_SELECTOR = 'section.grid.items-center.gap-2';
  const INJECTED_CLASS = 'new-inserted-element';
  const STYLE_ID = 'nezha-traffic-progress-style';

  let config = readConfig();
  let destroyed = false;
  let currentSection = null;
  let sectionDetector = null;
  let childObserver = null;
  let trafficTimer = null;
  let toggleTimer = null;
  let updateTimer = null;
  let detectorFrame = null;
  let updateRunning = false;
  let updateRequested = false;
  let toggleIndex = 0;

  // One bounded entry per currently rendered server.
  const entries = new Map();

  let trafficCache = null;
  let inFlightRequest = null;

  function readConfig() {
    return Object.assign({}, DEFAULT_CONFIG, window.TrafficScriptConfig || {});
  }

  function log(...args) {
    if (config.enableLog) console.log(`[TrafficScript ${VERSION}]`, ...args);
  }

  function injectCustomCSS() {
    if (document.getElementById(STYLE_ID)) return;
    const style = document.createElement('style');
    style.id = STYLE_ID;
    style.textContent = '.mt-4.w-full.mx-auto > div { display: none; }';
    document.head.appendChild(style);
  }

  function formatFileSize(bytes) {
    if (bytes === 0) return { value: '0', unit: 'B' };
    const units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
    let size = Number(bytes) || 0;
    let unitIndex = 0;
    while (size >= 1024 && unitIndex < units.length - 1) {
      size /= 1024;
      unitIndex += 1;
    }
    return {
      value: size.toFixed(unitIndex === 0 ? 0 : 2),
      unit: units[unitIndex]
    };
  }

  function calculatePercentage(used, total) {
    let normalizedUsed = Number(used);
    let normalizedTotal = Number(total);
    if (normalizedUsed > 1e15 || normalizedTotal > 1e15) {
      normalizedUsed /= 1e10;
      normalizedTotal /= 1e10;
    }
    return normalizedTotal === 0
      ? '0.00'
      : ((normalizedUsed / normalizedTotal) * 100).toFixed(2);
  }

  function formatDate(dateString) {
    const date = new Date(dateString);
    if (Number.isNaN(date.getTime())) return '';
    return date.toLocaleDateString('zh-CN', {
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    });
  }

  function getHslGradientColor(percentage) {
    const p = Math.min(Math.max(Number(percentage), 0), 100);
    const lerp = (start, end, value) => start + (end - start) * value;
    let h;
    let s;
    let l;

    if (p <= 35) {
      const t = p / 35;
      h = lerp(142, 32, t);
      s = lerp(69, 85, t);
      l = lerp(45, 55, t);
    } else if (p <= 85) {
      const t = (p - 35) / 50;
      h = lerp(32, 0, t);
      s = lerp(85, 75, t);
      l = lerp(55, 50, t);
    } else {
      const t = (p - 85) / 15;
      h = 0;
      s = 75;
      l = lerp(50, 45, t);
    }

    return `hsl(${h.toFixed(0)}, ${s.toFixed(0)}%, ${l.toFixed(0)}%)`;
  }

  function setTextIfChanged(parent, selector, nextValue) {
    const element = parent.querySelector(selector);
    if (element && element.textContent !== nextValue) element.textContent = nextValue;
  }

  function setStyleIfChanged(element, property, nextValue) {
    if (element && element.style[property] !== nextValue) {
      element.style[property] = nextValue;
    }
  }

  function clearEntry(entry, removeElement = false) {
    if (entry.fadeTimer) clearTimeout(entry.fadeTimer);
    entry.fadeTimer = null;
    if (removeElement && entry.el?.isConnected) entry.el.remove();
  }

  function pruneEntries(activeIds = null) {
    for (const [id, entry] of entries) {
      if (!entry.el?.isConnected || (activeIds && !activeIds.has(id))) {
        clearEntry(entry, false);
        entries.delete(id);
      }
    }
  }

  function buildServerElementMap() {
    const map = new Map();
    document.querySelectorAll(CARD_TITLE_SELECTOR).forEach((section) => {
      const name = section.querySelector('p')?.textContent?.trim();
      if (name && !map.has(name)) map.set(name, section);
    });
    return map;
  }

  function normalizeTrafficData(trafficData) {
    const servers = new Map();
    for (const cycleId in trafficData) {
      const cycle = trafficData[cycleId];
      if (!cycle?.server_name || !cycle?.transfer) continue;
      for (const serverId in cycle.server_name) {
        const name = cycle.server_name[serverId];
        const transfer = cycle.transfer[serverId];
        const nextUpdate = cycle.next_update?.[serverId];
        if (!name || transfer === undefined || !cycle.max || !cycle.from || !cycle.to) continue;
        servers.set(name, {
          id: String(serverId),
          transfer,
          max: cycle.max,
          from: cycle.from,
          to: cycle.to,
          nextUpdate
        });
      }
    }
    return servers;
  }

  function createMarkup(data) {
    return `
      <div class="flex items-center justify-between">
        <div class="flex items-baseline gap-1">
          <span class="text-[10px] font-medium text-neutral-800 dark:text-neutral-200 used-traffic">${data.used.value}</span>
          <span class="text-[10px] font-medium text-neutral-800 dark:text-neutral-200 used-unit">${data.used.unit}</span>
          <span class="text-[10px] text-neutral-500 dark:text-neutral-400">/ </span>
          <span class="text-[10px] text-neutral-500 dark:text-neutral-400 total-traffic">${data.total.value}</span>
          <span class="text-[10px] text-neutral-500 dark:text-neutral-400 total-unit">${data.total.unit}</span>
        </div>
        <div class="text-[10px] font-medium text-neutral-600 dark:text-neutral-300 time-info" style="opacity:1; transition: opacity 0.3s;">
          ${data.contents[0]}
        </div>
      </div>
      <div class="relative h-1.5">
        <div class="absolute inset-0 bg-neutral-100 dark:bg-neutral-800 rounded-full"></div>
        <div class="absolute inset-0 bg-emerald-500 rounded-full transition-all duration-300 progress-bar" style="width:${data.percentage}%; max-width:100%; background-color:${data.color};"></div>
      </div>`;
  }

  function findExistingElement(container, id) {
    return Array.from(container.querySelectorAll(`.${INJECTED_CLASS}`))
      .find((element) => element.dataset.trafficServerId === id) || null;
  }

  function updateEntry(entry, data) {
    const element = entry.el;
    setTextIfChanged(element, '.used-traffic', data.used.value);
    setTextIfChanged(element, '.used-unit', data.used.unit);
    setTextIfChanged(element, '.total-traffic', data.total.value);
    setTextIfChanged(element, '.total-unit', data.total.unit);
    setTextIfChanged(element, '.from-date', data.from);
    setTextIfChanged(element, '.to-date', data.to);
    setTextIfChanged(element, '.percentage-value', `${data.percentage}%`);
    setTextIfChanged(element, '.next-update', data.nextUpdate);

    const progressBar = element.querySelector('.progress-bar');
    setStyleIfChanged(progressBar, 'width', `${data.percentage}%`);
    setStyleIfChanged(progressBar, 'backgroundColor', data.color);

    // Keep rotating content current without creating another array entry.
    entry.contents = data.contents;
  }

  function renderTrafficStats(trafficData) {
    if (destroyed) return;

    const serverElements = buildServerElementMap();
    const servers = normalizeTrafficData(trafficData);
    const activeIds = new Set();

    for (const [serverName, serverData] of servers) {
      const targetElement = serverElements.get(serverName.trim());
      if (!targetElement) continue;

      const container = targetElement.closest('div');
      if (!container) continue;

      const id = serverData.id;
      activeIds.add(id);

      let entry = entries.get(id);
      if (entry && (!entry.el.isConnected || !container.contains(entry.el))) {
        clearEntry(entry, false);
        entries.delete(id);
        entry = null;
      }

      const used = formatFileSize(serverData.transfer);
      const total = formatFileSize(serverData.max);
      const percentage = calculatePercentage(serverData.transfer, serverData.max);
      const from = formatDate(serverData.from);
      const to = formatDate(serverData.to);
      const nextUpdate = serverData.nextUpdate
        ? new Date(serverData.nextUpdate).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' })
        : '';
      const color = getHslGradientColor(percentage);
      const contents = [
        `<span class="from-date">${from}</span>
                <span class="text-neutral-500 dark:text-neutral-400">-</span>
                <span class="to-date">${to}</span>`,
        `<span class="text-[10px] font-medium text-neutral-800 dark:text-neutral-200 percentage-value">${percentage}%</span>`,
        `<span class="text-[10px] font-medium text-neutral-600 dark:text-neutral-300 next-update">${nextUpdate}</span>`
      ];
      const viewData = { used, total, percentage, from, to, nextUpdate, color, contents };

      let element = entry?.el || findExistingElement(container, id);

      if (!config.showTrafficStats) {
        if (element) element.remove();
        if (entry) clearEntry(entry, false);
        entries.delete(id);
        continue;
      }

      if (!element) {
        element = document.createElement('div');
        element.className = `space-y-1.5 ${INJECTED_CLASS} traffic-stats-for-server-${id.replace(/[^a-zA-Z0-9_-]/g, '-')} nl-traffic-row`;
        element.dataset.trafficServerId = id;
        element.style.width = '100%';
        element.innerHTML = createMarkup(viewData);
        // 整行显示（合并改动）：作为卡片的直接子元素、宽 100%，在横向卡片里
        // 靠 .server-inline-list .cursor-pointer { flex-wrap: wrap } 换行独占
        // 一行，在纵向卡片里自然占满整行；插在延迟条（.nl-home-strip）之前，
        // 延迟条永远是卡片最后一个子元素，所以流量行始终在延迟条上面一行。
        // container 是卡片本身（标题 section 的 closest('div')）。
        // 上游的 anchor/insertAfter 逻辑不再使用（它会把流量块塞进统计列里）。
        const strip = container.querySelector('.nl-home-strip');
        if (strip) container.insertBefore(element, strip);
        else container.appendChild(element);
        entry = { el: element, contents, fadeTimer: null };
        entries.set(id, entry);
      } else {
        if (!entry) {
          entry = { el: element, contents, fadeTimer: null };
          entries.set(id, entry);
        }
        updateEntry(entry, viewData);
      }
    }

    pruneEntries(activeIds);
    log(`rendered ${entries.size} traffic entries`);
  }

  async function getTrafficData() {
    const now = Date.now();
    if (trafficCache && now - trafficCache.timestamp < config.interval) {
      return trafficCache.data;
    }
    if (inFlightRequest) return inFlightRequest;

    inFlightRequest = fetch(config.apiUrl, { credentials: 'same-origin' })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((payload) => {
        if (!payload?.success) throw new Error('Unexpected traffic API response');
        const data = payload.data?.cycle_transfer_stats || {};
        trafficCache = { timestamp: Date.now(), data };
        return data;
      })
      .catch((error) => {
        if (config.enableLog) console.error('[TrafficScript] request failed:', error);
        return trafficCache?.data || null;
      })
      .finally(() => {
        inFlightRequest = null;
      });

    return inFlightRequest;
  }

  async function updateTrafficStats() {
    if (destroyed || document.hidden) return;
    if (updateRunning) {
      updateRequested = true;
      return;
    }

    updateRunning = true;
    try {
      const trafficData = await getTrafficData();
      if (trafficData && !destroyed && !document.hidden) renderTrafficStats(trafficData);
    } finally {
      updateRunning = false;
      if (updateRequested) {
        updateRequested = false;
        scheduleUpdate(50);
      }
    }
  }

  function scheduleUpdate(delay = 80) {
    if (destroyed || document.hidden) return;
    if (updateTimer) clearTimeout(updateTimer);
    updateTimer = setTimeout(() => {
      updateTimer = null;
      updateTrafficStats();
    }, delay);
  }

  function rotateEntries() {
    if (destroyed || document.hidden || entries.size === 0) return;
    toggleIndex += 1;
    const index = toggleIndex % 3;

    pruneEntries();
    for (const entry of entries.values()) {
      const element = entry.el.querySelector('.time-info');
      const content = entry.contents[index];
      if (!element || !content) continue;

      if (entry.fadeTimer) clearTimeout(entry.fadeTimer);
      const halfDuration = Math.max(0, config.duration / 2);
      setStyleIfChanged(element, 'transition', `opacity ${halfDuration}ms`);
      setStyleIfChanged(element, 'opacity', '0');
      entry.fadeTimer = setTimeout(() => {
        entry.fadeTimer = null;
        if (!element.isConnected || destroyed) return;
        if (element.innerHTML !== content) element.innerHTML = content;
        setStyleIfChanged(element, 'opacity', '1');
      }, halfDuration);
    }
  }

  function stopTimers() {
    if (trafficTimer) clearInterval(trafficTimer);
    if (toggleTimer) clearInterval(toggleTimer);
    trafficTimer = null;
    toggleTimer = null;
  }

  function startTimers() {
    stopTimers();
    if (destroyed || document.hidden) return;
    if (config.interval > 0) {
      trafficTimer = setInterval(updateTrafficStats, config.interval);
    }
    if (config.toggleInterval > 0) {
      toggleTimer = setInterval(rotateEntries, config.toggleInterval);
    }
  }

  function observeSection(section) {
    if (section === currentSection && childObserver) return;
    if (childObserver) childObserver.disconnect();
    currentSection = section;
    childObserver = new MutationObserver(() => scheduleUpdate());
    childObserver.observe(section, { childList: true, subtree: false });
    scheduleUpdate(0);
  }

  function detectSection() {
    detectorFrame = null;
    if (destroyed) return;
    const section = document.querySelector(TARGET_SELECTOR);
    if (section && section !== currentSection) observeSection(section);
  }

  function scheduleSectionDetection() {
    if (detectorFrame !== null || destroyed) return;
    detectorFrame = requestAnimationFrame(detectSection);
  }

  function mutationMayAffectSection(mutations) {
    if (!currentSection?.isConnected) return true;
    for (const mutation of mutations) {
      // The child observer owns changes inside the active list.
      if (currentSection.contains(mutation.target)) continue;
      for (const node of [...mutation.addedNodes, ...mutation.removedNodes]) {
        if (node.nodeType !== Node.ELEMENT_NODE) continue;
        if (node.matches?.(TARGET_SELECTOR) || node.querySelector?.(TARGET_SELECTOR)) return true;
      }
    }
    return false;
  }

  function startObservers() {
    const root = document.querySelector('main') || document.body;
    sectionDetector = new MutationObserver((mutations) => {
      if (mutationMayAffectSection(mutations)) scheduleSectionDetection();
    });
    sectionDetector.observe(root, { childList: true, subtree: true });
    detectSection();
  }

  function handleVisibilityChange() {
    if (document.hidden) {
      stopTimers();
      if (updateTimer) clearTimeout(updateTimer);
      updateTimer = null;
      for (const entry of entries.values()) {
        if (entry.fadeTimer) clearTimeout(entry.fadeTimer);
        entry.fadeTimer = null;
      }
      return;
    }

    startTimers();
    scheduleSectionDetection();
    scheduleUpdate(0);
  }

  function destroy() {
    if (destroyed) return;
    destroyed = true;
    stopTimers();
    if (updateTimer) clearTimeout(updateTimer);
    if (detectorFrame !== null) cancelAnimationFrame(detectorFrame);
    if (sectionDetector) sectionDetector.disconnect();
    if (childObserver) childObserver.disconnect();
    for (const entry of entries.values()) clearEntry(entry, false);
    entries.clear();
    document.removeEventListener('visibilitychange', handleVisibilityChange);
    window.removeEventListener('beforeunload', destroy);
  }

  injectCustomCSS();
  startObservers();
  startTimers();
  scheduleUpdate(0);

  document.addEventListener('visibilitychange', handleVisibilityChange, { passive: true });
  window.addEventListener('beforeunload', destroy, { once: true });

  // Preserve support for configuration assigned shortly after script parsing.
  setTimeout(() => {
    if (destroyed) return;
    const nextConfig = readConfig();
    if (JSON.stringify(nextConfig) === JSON.stringify(config)) return;
    config = nextConfig;
    startTimers();
    scheduleUpdate(0);
  }, 100);

  window[INSTANCE_KEY] = {
    version: VERSION,
    destroy,
    refresh() {
      trafficCache = null;
      scheduleUpdate(0);
    },
    getEntryCount() {
      pruneEntries();
      return entries.size;
    }
  };
})();
</script>
